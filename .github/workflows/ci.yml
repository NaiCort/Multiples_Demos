name: Revision

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Formato
        run: npm run format:check
      - name: Pruebas
        run: npm test
      - name: Compilacion
        run: npm run build
